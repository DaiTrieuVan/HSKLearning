# ============================================================================
# HSK backend — HTT-01-CN-001
#
# Secrets never live in this file. They come from the .env file next to the
# module root, imported below as a properties file (no extra dependency, and
# .env is git-ignored). See .env.example for the list of expected variables.
# ============================================================================
spring:
  application:
    name: hsk-backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hsk_learning?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:hsk_app}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: hsk-pool
      maximum-pool-size: 10
      connection-timeout: 10000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # A migration must never run against a schema created by something else.
    baseline-on-missing: false
    validate-migration-naming: true

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only verifies the mapping matches it.
      ddl-auto: validate
    # Open-session-in-view is off so a transaction boundary is a deliberate choice.
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Ho_Chi_Minh

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.hsk: DEBUG
    org.springframework.web: INFO

---
# ---------------------------------------------------------------------------
# Test profile: a dedicated schema, rebuilt on every run so tests stay
# deterministic (agreed option A — plain local MySQL, no Testcontainers).
# ---------------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/hsk_learning_test?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:hsk_app}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
  flyway:
    # TestDatabaseConfig replaces this with clean + migrate on every run.
    clean-disabled: false

logging:
  level:
    com.hsk: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
